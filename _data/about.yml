name: onebom
portrait: ""
intro: >-
  I work on deep learning for computer vision and generative models.
  My experience spans medical image analysis, object detection, and AI applications,
  with research experience at MIDAS and the Multi-Modality Medical Imaging Lab (MMMIL).
research_intro: >-
  I am interested in generative models, especially diffusion and score-based methods,
  and their foundations in linear algebra and probability. My projects explore how
  visual representations can support practical tasks, from medical image classification
  to object detection and interactive applications.

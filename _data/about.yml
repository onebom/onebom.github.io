name: Hanbom Woo
portrait: "/assets/img/me.jpeg"
intro: |-
  Hi, I’m a research engineer with a background in computer vision and generative models.
  I received my M.S. from **Sungkyunkwan University (SKKU)**, where I conducted research at the **Machine Intelligence & Data Science (MIDAS) Lab**, advised by **Prof. Il Yong Chun**.
  Currently, I focus on long-term video prediction using object-centric diffusion models.

  My research interests include:

  - Video Modeling and 3D Gaussian Splatting (3DGS)
  - Generative AI
  - Multimodal AI

